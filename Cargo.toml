[workspace]
resolver = "2"
members = ["crates/core", "crates/transports", "crates/server", "crates/settings", "crates/agent"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
zprint-core = { path = "crates/core" }
zprint-transports = { path = "crates/transports" }
zprint-server = { path = "crates/server" }
zprint-settings = { path = "crates/settings" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
directories = "5"
eframe = { version = "0.37", default-features = false }
ksni = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
